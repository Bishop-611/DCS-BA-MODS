name: Publish FOX SENSE 0.10.13
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fox-release-0.10.13.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify privacy and exact tested package hashes
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'FOX SENSE/Release/0.10.13/FOX-SENSE-0.10.13-Setup.exe').Path
          $assembly=[Reflection.Assembly]::LoadFile($exe)
          $stream=$assembly.GetManifestResourceStream('Fox.Payload.zip')
          if(!$stream){throw 'Installer payload not found'}
          $payload=Join-Path $env:RUNNER_TEMP 'fox-verified-payload.zip'
          $output=[IO.File]::Create($payload)
          try{$stream.CopyTo($output)}finally{$stream.Dispose();$output.Dispose()}
          python 'FOX SENSE/Tools/verify_privacy.py' 'FOX SENSE' --embedded-payload $payload
          if ($LASTEXITCODE) { throw 'Privacy or checksum validation failed' }
      - name: Publish verified assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='fox-sense-v0.10.13'
          $folder='FOX SENSE/Release/0.10.13'
          $existing=gh release view $tag --json isDraft 2>$null
          if($LASTEXITCODE -eq 0){
            if(-not ($existing|ConvertFrom-Json).isDraft){throw 'Published release already exists; refusing replacement'}
          }else{
            gh release create $tag --draft --target $env:GITHUB_SHA --title 'FOX SENSE 0.10.13 - Adaptive display proportions' --notes-file 'FOX SENSE/RELEASE-0.10.13.md'
            if($LASTEXITCODE){throw 'Draft release creation failed'}
          }
          $names=@('FOX-SENSE-0.10.13-Setup.exe','FOX-SENSE-0.10.13-EXE.zip','FOX-SENSE-0.10.13-Manual.zip','SHA256SUMS.txt')
          foreach($name in $names){
            gh release upload $tag (Join-Path $folder $name) --clobber
            if($LASTEXITCODE){throw 'Asset upload failed'}
          }
          $release=gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          if($LASTEXITCODE){throw 'Release verification request failed'}
          foreach($name in $names){
            $asset=$release.assets|Where-Object name -eq $name
            $file=Join-Path $folder $name
            $expected='sha256:'+(Get-FileHash -LiteralPath $file).Hash.ToLowerInvariant()
            if(!$asset -or $asset.state -ne 'uploaded' -or $asset.size -ne (Get-Item -LiteralPath $file).Length -or $asset.digest -ne $expected){throw 'Uploaded asset verification failed'}
          }
          gh release edit $tag --draft=false --latest=false
          if($LASTEXITCODE){throw 'Release publication failed'}
          Write-Output 'PASS: four asset digests verified and release published.'
