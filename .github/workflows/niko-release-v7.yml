name: Publish Niko WSO v7
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'F4E-Niko WSO/build/**'
      - '.github/workflows/niko-release-v7.yml'
permissions:
  contents: write
concurrency:
  group: niko-release-v7
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download the published v6 baseline
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $client=New-Object Net.WebClient
          try{$client.DownloadFile('https://github.com/Bishop-611/DCS-BA-MODS/releases/download/f4e-niko-wso-v6/F4E-Niko.WSO.exe',(Join-Path $env:RUNNER_TEMP 'Niko-v6.exe'))}finally{$client.Dispose()}
      - name: Build v7 with FOX PLATOON v0.13
        shell: powershell
        run: |
          & './F4E-Niko WSO/build/Build-V7.ps1' -BaseExe (Join-Path $env:RUNNER_TEMP 'Niko-v6.exe') -GenerateLivery -OutputRoot (Join-Path $env:RUNNER_TEMP 'Niko-v7')
          if($LASTEXITCODE){exit $LASTEXITCODE}
      - name: Publish the complete installer
        shell: pwsh
        env:
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          $api='https://api.github.com/repos/'+$env:GITHUB_REPOSITORY
          $headers=@{Authorization=('Bearer '+$env:RELEASE_TOKEN);'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='Niko-Release-Build'}
          $tag='f4e-niko-wso-v7'
          $release=$null
          try{$release=Invoke-RestMethod -Uri ($api+'/releases/tags/'+$tag) -Headers $headers}catch{if([int]$_.Exception.Response.StatusCode -ne 404){throw}}
          if($release -and -not $release.draft){throw 'v7 is already published. Increment the release version before publishing another build.'}
          if(-not $release){
            $body=@{tag_name=$tag;target_commitish=$env:GITHUB_SHA;name='F4E-Niko WSO v7';draft=$true;prerelease=$false;body="Complete Niko WSO package with FOX PLATOON v0.13.`n`nDarker camouflage, stronger rivet/panel-seam definition and repaired normal-map DDS headers. Character models, portrait, voice and Tape Player content are retained from v6.`n`nClose DCS, run F4E-Niko-WSO-v7.exe, select the DCS World and active Saved Games profile, then choose Install All. Known v0.9-v0.12 livery revisions are accepted for upgrade; unknown edits still stop the operation. Keep NikoWSO_Backups for restoration.`n`nThis build was packaged as requested without an additional test or in-game review pass. Verify file identity using the accompanying SHA256 file."}|ConvertTo-Json
            $release=Invoke-RestMethod -Uri ($api+'/releases') -Method Post -Headers $headers -ContentType 'application/json' -Body $body
          }
          foreach($name in @('F4E-Niko-WSO-v7.exe','F4E-Niko-WSO-v7.sha256')){
            $path=Join-Path (Join-Path $env:RUNNER_TEMP 'Niko-v7') $name
            $existing=@($release.assets|Where-Object name -eq $name)
            foreach($asset in $existing){Invoke-RestMethod -Uri ($api+'/releases/assets/'+$asset.id) -Method Delete -Headers $headers|Out-Null}
            $upload='https://uploads.github.com/repos/'+$env:GITHUB_REPOSITORY+'/releases/'+$release.id+'/assets?name='+[Uri]::EscapeDataString($name)
            Invoke-RestMethod -Uri $upload -Method Post -Headers $headers -ContentType 'application/octet-stream' -InFile $path -TimeoutSec 1800|Out-Null
          }
          Invoke-RestMethod -Uri ($api+'/releases/'+$release.id) -Method Patch -Headers $headers -ContentType 'application/json' -Body '{"draft":false}'|Out-Null
          'Published https://github.com/'+$env:GITHUB_REPOSITORY+'/releases/tag/'+$tag

