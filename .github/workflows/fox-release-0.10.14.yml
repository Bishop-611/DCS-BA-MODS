name: Publish FOX SENSE 0.10.14
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fox-release-0.10.14.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify distributables and embedded payload
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'FOX SENSE/Release/0.10.14/FOX-SENSE-0.10.14-Setup.exe').Path
          $assembly=[Reflection.Assembly]::LoadFile($exe)
          $stream=$assembly.GetManifestResourceStream('Fox.Payload.zip')
          if(!$stream){throw 'Missing embedded payload'}
          $payload=Join-Path $env:RUNNER_TEMP 'fox-verified-payload.zip'
          $output=[IO.File]::Create($payload)
          try{$stream.CopyTo($output)}finally{$output.Dispose();$stream.Dispose()}
          python 'FOX SENSE/Tools/verify_privacy.py' 'FOX SENSE' --embedded-payload $payload
          if($LASTEXITCODE){throw 'Privacy or checksum validation failed'}
      - name: Publish verified assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='fox-sense-v0.10.14'
          $folder='FOX SENSE/Release/0.10.14'
          $existing=gh release view $tag --json isDraft 2>$null
          if($LASTEXITCODE -eq 0){
            Write-Output 'Updating verified release assets after manual guide correction.'
          }else{
            gh release create $tag --draft --target $env:GITHUB_SHA --title 'FOX SENSE 0.10.14 - Original portrait recovery' --notes-file 'FOX SENSE/RELEASE-0.10.14.md'
            if($LASTEXITCODE){throw 'Draft creation failed'}
          }
          $names=@('FOX-SENSE-0.10.14-Setup.exe','FOX-SENSE-0.10.14-EXE.zip','FOX-SENSE-0.10.14-Manual.zip','SHA256SUMS.txt')
          foreach($name in $names){
            gh release upload $tag "$folder/$name" --clobber
            if($LASTEXITCODE){throw 'Asset upload failed'}
          }
          $releases=gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if($LASTEXITCODE){throw 'Release verification failed'}
          $release=@($releases | Where-Object tag_name -eq $tag)
          if($release.Count -ne 1){throw 'Release missing or ambiguous'}
          foreach($name in $names){
            $asset=@($release[0].assets | Where-Object name -eq $name)
            $file=Get-Item -LiteralPath "$folder/$name"
            $digest='sha256:'+(Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLower()
            if($asset.Count -ne 1 -or $asset[0].state -ne 'uploaded' -or $asset[0].size -ne $file.Length -or $asset[0].digest -ne $digest){throw 'Uploaded asset verification failed'}
          }
          gh release edit $tag --draft=false --latest=false
          if($LASTEXITCODE){throw 'Release publication failed'}
          Write-Output 'PASS: all four uploaded assets verified and release published.'
